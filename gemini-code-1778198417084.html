<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Intelligence Dashboard | CDMX</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #292721; 
            --primary: #b5cb32;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff; 
            --text-sec: #94a3b8; 
            --border: rgba(255, 255, 255, 0.1);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding: 24px; 
            letter-spacing: -0.2px;
        }

        .container { max-width: 1500px; margin: 0 auto; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }

        .brand h1 { font-size: 20px; font-weight: 800; color: #fff; }
        .brand span { color: var(--primary); }
        
        .filters-area { display: flex; gap: 12px; }
        .filter-pill { 
            background: rgba(0,0,0,0.25); padding: 8px 16px; border-radius: 12px; 
            border: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
        }
        .filter-pill label { font-size: 9px; font-weight: 800; color: var(--text-sec); text-transform: uppercase; }
        .filter-pill select { 
            border: none; background: transparent; font-size: 13px; font-weight: 600; 
            outline: none; color: #fff; cursor: pointer;
        }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .metric-card { 
            background: var(--bg-card); padding: 20px; border-radius: var(--radius); 
            border: 1px solid var(--border); transition: 0.3s;
        }
        .metric-card:hover { border-color: var(--primary); }
        .metric-label { font-size: 10px; color: var(--text-sec); text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 28px; font-weight: 800; margin: 8px 0; color: #fff; }
        .metric-sub { font-size: 11px; color: var(--primary); font-weight: 600; }

        .layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 25px; margin-bottom: 25px; }
        @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

        .card { 
            background: var(--bg-card); border-radius: var(--radius); 
            border: 1px solid var(--border); padding: 20px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .card-title { font-size: 13px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        #map { height: 500px; width: 100%; border-radius: 12px; border: 1px solid var(--border); filter: invert(100%) hue-rotate(180deg) brightness(0.7) contrast(0.9); }

        .iso-selector { display: flex; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 10px; }
        .iso-btn { 
            border: none; background: none; padding: 6px 14px; font-size: 11px; font-weight: 700; 
            cursor: pointer; border-radius: 7px; color: var(--text-sec); transition: 0.2s;
        }
        .iso-btn.active { background: #fff; color: var(--bg-body); }

        .ranking-item { 
            display: flex; align-items: center; padding: 12px; 
            background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 8px;
            border: 1px solid transparent;
        }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 13px; font-weight: 600; color: #fff; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-info small { color: var(--text-sec); font-size: 11px; }
        .rank-score { font-weight: 800; font-size: 13px; margin-left: 10px; color: var(--primary); }

        .bar-row { margin-bottom: 15px; }
        .bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 10px; margin-top: 6px; overflow: hidden; }
        .bar-fill { background: var(--primary); height: 100%; border-radius: 10px; transition: width 1s ease; }

        /* Estilo para Chart.js Tooltips */
        .leaflet-popup-content-wrapper { background: #1a1a1a; color: #fff; border: 1px solid var(--border); }
        .leaflet-popup-tip { background: #1a1a1a; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand"><h1>Market<span>Intelligence</span></h1></div>
        <div class="filters-area">
            <div class="filter-pill"><label>Categoría</label><select id="catSel" onchange="render()"><option value="all">Cargando...</option></select></div>
            <div class="filter-pill"><label>Rating</label><select id="ratSel" onchange="render()"><option value="0">Todos</option><option value="4">4.0+</option><option value="4.5">4.5+</option></select></div>
        </div>
    </header>

    <div class="metrics-grid" id="metricsRow"></div>

    <div class="layout">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Mapa de Calor y Proximidad</div>
                <div class="iso-selector">
                    <button class="iso-btn active" onclick="setIso(this, 500)">500m</button>
                    <button class="iso-btn" onclick="setIso(this, 1000)">1km</button>
                    <button class="iso-btn" onclick="setIso(this, 1500)">1.5km</button>
                </div>
            </div>
            <div id="map"></div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">Top Lugares en Zona</div></div>
            <div id="topList"></div>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:25px;">
        <div class="card"><div class="card-title">Categorías Dominantes</div><div id="catChart" style="margin-top:15px;"></div></div>
        <div class="card"><div class="card-title">Calidad del Mercado Local</div><div style="height:200px;"><canvas id="ratingChart"></canvas></div></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>
let RDATA = [];
let CURRENT_CENTER = [19.414, -99.172]; 
let currentIsoRadius = 500;
let map, markersCluster, isoCircle, rChart;

async function cargarDatos() {
    try {
        const res = await fetch('datos.json');
        RDATA = await res.json();
        RDATA.forEach(r => {
            r.rating = (r.rating === "" || r.rating === "#N/A") ? 0 : parseFloat(r.rating);
            r.num_resenas = (r.num_resenas === "" || r.num_resenas === "#N/A") ? 0 : parseInt(r.num_resenas);
        });
        init();
    } catch (e) { console.error("Error al cargar datos.json"); }
}

function init() {
    const cats = [...new Set(RDATA.map(r => r.categoria))].filter(c => c).sort(); 
    const sel = document.getElementById('catSel');
    sel.innerHTML = '<option value="all">Todas</option>';
    cats.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });

    map = L.map('map', { zoomControl: false }).setView(CURRENT_CENTER, 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

    isoCircle = L.circle(CURRENT_CENTER, { 
        radius: currentIsoRadius, 
        fillColor: '#ffffff', 
        fillOpacity: 0.05, 
        color: '#b5cb32', 
        weight: 1, 
        dashArray: '4, 8' 
    }).addTo(map);
    
    map.on('click', function(e) {
        CURRENT_CENTER = [e.latlng.lat, e.latlng.lng];
        isoCircle.setLatLng(e.latlng);
        render();
    });

    markersCluster = L.markerClusterGroup({ disableClusteringAtZoom: 16 });
    map.addLayer(markersCluster);

    render();
}

function setIso(btn, meters) {
    document.querySelectorAll('.iso-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentIsoRadius = meters;
    isoCircle.setRadius(meters);
    render();
}

function getDist(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
    const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function render() {
    const catFiltro = document.getElementById('catSel').value;
    const ratMin = parseFloat(document.getElementById('ratSel').value);
    
    const filtered = RDATA.filter(r => (catFiltro === 'all' || r.categoria === catFiltro) && r.rating >= ratMin);
    const inIso = filtered.filter(r => getDist(CURRENT_CENTER[0], CURRENT_CENTER[1], r.latitud, r.longitud) <= currentIsoRadius);
    
    const avgRat = inIso.reduce((s, r) => s + r.rating, 0) / inIso.length || 0;
    const maxRes = inIso.length ? inIso.reduce((p, c) => (p.num_resenas > c.num_resenas ? p : c)) : {num_resenas:0, nombre:'N/A'};

    document.getElementById('metricsRow').innerHTML = `
        <div class="metric-card"><div class="metric-label">Locales en Zona</div><div class="metric-value">${inIso.length}</div><div class="metric-sub">Saturación local</div></div>
        <div class="metric-card"><div class="metric-label">Rating Promedio</div><div class="metric-value">${avgRat.toFixed(2)}</div><div class="metric-sub">Calidad promedio</div></div>
        <div class="metric-card"><div class="metric-label">Líder de Reseñas</div><div class="metric-value">${maxRes.num_resenas.toLocaleString()}</div><div class="metric-sub">${maxRes.nombre}</div></div>
        <div class="metric-card"><div class="metric-label">Competencia Total</div><div class="metric-value">${filtered.length}</div><div class="metric-sub">CDMX</div></div>
    `;

    markersCluster.clearLayers();
    filtered.forEach(r => {
        const inside = getDist(CURRENT_CENTER[0], CURRENT_CENTER[1], r.latitud, r.longitud) <= currentIsoRadius;
        const m = L.circleMarker([r.latitud, r.longitud], {
            radius: inside ? 6 : 3,
            fillColor: r.rating >= 4 ? '#b5cb32' : '#ffffff',
            color: "#fff", weight: 0.5, fillOpacity: inside ? 1 : 0.1
        }).bindPopup(`<b>${r.nombre}</b><br>Rating: ${r.rating}`);
        markersCluster.addLayer(m);
    });

    const top = [...inIso].sort((a,b) => b.rating - a.rating).slice(0, 7);
    document.getElementById('topList').innerHTML = top.map((r) => `
        <div class="ranking-item">
            <div class="rank-info"><span class="rank-name">${r.nombre}</span><small>${r.categoria}</small></div>
            <div class="rank-score">⭐ ${r.rating.toFixed(1)}</div>
        </div>
    `).join('') || '<p style="font-size:12px;color:#94a3b8;padding:20px;">Sin datos en el radio</p>';

    const cMap = {}; inIso.forEach(r => cMap[r.categoria] = (cMap[r.categoria] || 0) + 1);
    const topCats = Object.entries(cMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
    const maxC = topCats[0] ? topCats[0][1] : 1;
    document.getElementById('catChart').innerHTML = topCats.map(([n,v]) => `
        <div class="bar-row">
            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:600; color:#fff"><span>${n}</span><span>${v}</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${(v/maxC)*100}%"></div></div>
        </div>
    `).join('');

    const b = [0,0,0,0]; inIso.forEach(r => { if(r.rating >= 4.5) b[3]++; else if(r.rating >= 4.0) b[2]++; else if(r.rating >= 3.5) b[1]++; else b[0]++; });
    if(rChart) rChart.destroy();
    rChart = new Chart(document.getElementById('ratingChart'), {
        type: 'bar',
        data: { labels: ['<3.5','3.5-4','4-4.5','4.5+'], datasets: [{ data: b, backgroundColor: '#b5cb32', borderRadius: 4 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#94a3b8'}}, x:{ticks:{color:'#94a3b8'}}}}
    });
}
cargarDatos();
</script>
</body>
</html>
