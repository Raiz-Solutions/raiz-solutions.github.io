<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis ubicación industria restaurantera CDMX</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb; --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #1e293b; --text-sec: #64748b; --border: #e2e8f0;
            --radius: 12px; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .brand h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
        
        .filters-area { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-pill { background: var(--bg-card); padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .filter-pill label { font-size: 10px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; }
        .filter-pill select { border: none; background: transparent; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; color: inherit; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .metric-card { background: var(--bg-card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); }
        .metric-label { font-size: 10px; color: var(--text-sec); text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 20px; font-weight: 700; margin: 4px 0; }
        .metric-sub { font-size: 11px; color: var(--text-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 13px; font-weight: 700; }

        #map { height: 500px; width: 100%; border-radius: 8px; z-index: 1; border: 1px solid var(--border); }

        .iso-selector { display: flex; background: var(--bg-body); padding: 3px; border-radius: 8px; }
        .iso-btn { border: none; background: none; padding: 5px 10px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 5px; color: var(--text-sec); }
        .iso-btn.active { background: var(--primary); color: white; }

        .ranking-item { display: flex; align-items: center; padding: 10px; background: var(--bg-body); border-radius: 8px; margin-bottom: 6px; }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-score { font-weight: 700; font-size: 12px; margin-left: 10px; color: var(--primary); }

        .bar-row { margin-bottom: 10px; }
        .bar-bg { background: var(--bg-body); height: 6px; border-radius: 10px; margin-top: 3px; }
        .bar-fill { background: var(--primary); height: 100%; border-radius: 10px; transition: width 0.8s; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand"><h1>Análisis industria restaurantera</h1></div>
        <div class="filters-area">
            <div class="filter-pill"><label>Giro</label><select id="catSel" onchange="render()"><option value="all">Cargando...</option></select></div>
            <div class="filter-pill"><label>Rating Min</label><select id="ratSel" onchange="render()"><option value="0">Todos</option><option value="4">4.0+</option><option value="4.5">4.5+</option></select></div>
        </div>
    </header>

    <div class="metrics-grid" id="metricsRow"></div>

    <div class="layout">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Distribución y Proximidad</div>
                <div class="iso-selector">
                    <button class="iso-btn active" onclick="setIso(this, 500)">5 min</button>
                    <button class="iso-btn" onclick="setIso(this, 1000)">10 min</button>
                    <button class="iso-btn" onclick="setIso(this, 1500)">15 min</button>
                </div>
            </div>
            <div id="map"></div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">Top Lugares (Rating)</div></div>
            <div id="topList"></div>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:20px;">
        <div class="card"><div class="card-title">Categorías Dominantes</div><div id="catChart" style="margin-top:15px;"></div></div>
        <div class="card"><div class="card-title">Calidad del Mercado</div><div style="height:180px;"><canvas id="ratingChart"></canvas></div></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>
let RDATA = [];
const CENTER = [19.414, -99.172]; 
let currentIsoRadius = 500;
let map, markersCluster, isoCircle, rChart;

async function cargarDatos() {
    try {
        const res = await fetch('datos.json');
        RDATA = await res.json();
        // Limpieza básica de datos numéricos
        RDATA.forEach(r => {
            r.rating = (r.rating === "" || r.rating === "#N/A") ? 0 : parseFloat(r.rating);
            r.num_resenas = (r.num_resenas === "" || r.num_resenas === "#N/A") ? 0 : parseInt(r.num_resenas);
        });
        init();
    } catch (e) { document.querySelector('.brand h1').innerText = "Error cargando datos.json"; }
}

function init() {
    const cats = [...new Set(RDATA.map(r => r.categoria))].filter(c => c).sort(); 
    const sel = document.getElementById('catSel');
    sel.innerHTML = '<option value="all">Todas las categorías</option>';
    cats.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });

    map = L.map('map').setView(CENTER, 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'CARTO' }).addTo(map);

    isoCircle = L.circle(CENTER, { radius: currentIsoRadius, fillColor: '#2563eb', fillOpacity: 0.1, color: '#2563eb', weight: 1, dashArray: '5,5' }).addTo(map);
    
    markersCluster = L.markerClusterGroup({ disableClusteringAtZoom: 16, chunkedLoading: true });
    map.addLayer(markersCluster);

    render();
}

function setIso(btn, meters) {
    document.querySelectorAll('.iso-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentIsoRadius = meters;
    isoCircle.setRadius(meters);
    render();
}

function getDist(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
    const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function render() {
    const catFiltro = document.getElementById('catSel').value;
    const ratMin = parseFloat(document.getElementById('ratSel').value);
    
    const filtered = RDATA.filter(r => (catFiltro === 'all' || r.categoria === catFiltro) && r.rating >= ratMin);
    const inIso = filtered.filter(r => getDist(CENTER[0], CENTER[1], r.latitud, r.longitud) <= currentIsoRadius);
    const avgRat = filtered.reduce((s, r) => s + r.rating, 0) / filtered.length || 0;
    const maxRes = filtered.length ? filtered.reduce((p, c) => (p.num_resenas > c.num_resenas ? p : c)) : {num_resenas:0, nombre:'N/A'};

    document.getElementById('metricsRow').innerHTML = `
        <div class="metric-card"><div class="metric-label">Locales Analizados</div><div class="metric-value">${filtered.length.toLocaleString()}</div><div class="metric-sub">Filtros actuales</div></div>
        <div class="metric-card"><div class="metric-label">Competencia en Radio</div><div class="metric-value">${inIso.length.toLocaleString()}</div><div class="metric-sub">Dentro de isócrona</div></div>
        <div class="metric-card"><div class="metric-label">Rating Promedio</div><div class="metric-value">${avgRat.toFixed(1)}</div><div class="metric-sub">Calidad de oferta</div></div>
        <div class="metric-card"><div class="metric-label">Líder Opinión</div><div class="metric-value">${maxRes.num_resenas.toLocaleString()}</div><div class="metric-sub">${maxRes.nombre}</div></div>
    `;

    markersCluster.clearLayers();
    const tempMarkers = [];
    filtered.forEach(r => {
        const inside = getDist(CENTER[0], CENTER[1], r.latitud, r.longitud) <= currentIsoRadius;
        const m = L.circleMarker([r.latitud, r.longitud], {
            radius: inside ? 6 : 4,
            fillColor: r.rating >= 4.3 ? '#10b981' : r.rating >= 3.8 ? '#f59e0b' : '#ef4444',
            color: "#fff", weight: 1, fillOpacity: inside ? 0.9 : 0.2
        }).bindPopup(`<b>${r.nombre}</b><br>${r.categoria}<br>Rating: ${r.rating} · Reseñas: ${r.num_resenas}`);
        tempMarkers.push(m);
    });
    markersCluster.addLayers(tempMarkers);

    const top = [...filtered].sort((a,b) => b.rating - a.rating).slice(0, 8);
    document.getElementById('topList').innerHTML = top.map((r) => `
        <div class="ranking-item">
            <div class="rank-info"><span class="rank-name">${r.nombre}</span><small>${r.categoria}</small></div>
            <div class="rank-score">⭐ ${r.rating.toFixed(1)}</div>
        </div>
    `).join('');

    const cMap = {}; filtered.forEach(r => cMap[r.categoria] = (cMap[r.categoria] || 0) + 1);
    const topCats = Object.entries(cMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
    const maxC = topCats[0] ? topCats[0][1] : 1;
    document.getElementById('catChart').innerHTML = topCats.map(([n,v]) => `
        <div class="bar-row">
            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:600"><span>${n}</span><span>${v}</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${(v/maxC)*100}%"></div></div>
        </div>
    `).join('');

    const b = [0,0,0,0]; filtered.forEach(r => { if(r.rating >= 4.5) b[3]++; else if(r.rating >= 4.0) b[2]++; else if(r.rating >= 3.5) b[1]++; else b[0]++; });
    if(rChart) rChart.destroy();
    rChart = new Chart(document.getElementById('ratingChart'), {
        type: 'bar',
        data: { labels: ['<3.5','3.5-4','4-4.5','4.5+'], datasets: [{ data: b, backgroundColor: ['#ef4444','#f59e0b','#3b82f6','#10b981'], borderRadius: 5 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{display:false}}}}
    });
}
cargarDatos();
</script>
</body>
</html>
