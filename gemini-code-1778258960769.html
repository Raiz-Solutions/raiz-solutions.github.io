<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis ubicación industria restaurantera CDMX</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #b5cb32; 
            --bg-body: #292721; 
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff; 
            --text-sec: #94a3b8; 
            --border: rgba(255, 255, 255, 0.1);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .brand h1 { font-size: 18px; font-weight: 700; color: #ffffff; }
        
        .filters-area { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-pill { background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .filter-pill label { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        .filter-pill select { border: none; background: transparent; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; color: #fff; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .metric-card { background: var(--bg-card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); }
        .metric-label { font-size: 10px; color: var(--text-sec); text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 20px; font-weight: 700; margin: 4px 0; color: #fff; }
        .metric-sub { font-size: 11px; color: var(--primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 13px; font-weight: 700; color: #ffffff; }

        #map { height: 500px; width: 100%; border-radius: 8px; z-index: 1; border: 1px solid var(--border); filter: grayscale(1); }

        .iso-selector { display: flex; background: rgba(0,0,0,0.2); padding: 3px; border-radius: 8px; }
        .iso-btn { border: none; background: none; padding: 5px 10px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 5px; color: var(--text-sec); }
        .iso-btn.active { background: var(--primary); color: #292721; }

        .ranking-item { display: flex; align-items: center; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 6px; }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
        .rank-info small { color: var(--text-sec); }
        .rank-score { font-weight: 700; font-size: 12px; margin-left: 10px; color: var(--primary); }

        .bar-row { margin-bottom: 10px; }
        .bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; margin-top: 3px; }
        .bar-fill { background: var(--primary); height: 100%; border-radius: 10px; transition: width 0.8s; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand"><h1>Análisis ubicación industria restaurantera</h1></div>
        <div class="filters-area">
            <div class="filter-pill"><label>Giro</label><select id="catSel" onchange="render()"><option value="all">Cargando...</option></select></div>
            <div class="filter-pill"><label>Rating Min</label><select id="ratSel" onchange="render()"><option value="0">Todos</option><option value="4">4.0+</option><option value="4.5">4.5+</option></select></div>
        </div>
    </header>

    <div class="metrics-grid" id="metricsRow"></div>

    <div class="layout">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Distribución y Proximidad</div>
                <div class="iso-selector">
                    <button class="iso-btn active" onclick="setIso(this, 500)">5 min</button>
                    <button class="iso-btn" onclick="setIso(this, 1000)">10 min</button>
                    <button class="iso-btn" onclick="setIso(this, 150
